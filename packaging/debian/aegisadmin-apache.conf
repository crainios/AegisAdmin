Listen 8443

<IfModule mod_ssl.c>
<VirtualHost *:8443>
    ServerName aegisadmin.local
    SSLEngine on
    SSLCertificateFile "/etc/aegisadmin-system/tls/admin-local.crt"
    SSLCertificateKeyFile "/etc/aegisadmin-system/tls/admin-local.key"
    SSLProxyEngine on
    SSLProxyVerify none
    SSLProxyCheckPeerName off
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "DENY"
    <Location />
        Require all granted
        ProxyPass https://127.0.0.1:9080/
        ProxyPassReverse https://127.0.0.1:9080/
    </Location>
</VirtualHost>
</IfModule>
