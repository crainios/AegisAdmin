Alias /private-downloads/ /var/lib/aegisadmin-download-stats/public/

<Directory /var/lib/aegisadmin-download-stats/public>
    Options -Indexes
    AllowOverride None
    DirectoryIndex index.html

    AuthType Basic
    AuthName "AegisAdmin download statistics"
    AuthUserFile /etc/apache2/aegisadmin-download-stats.htpasswd
    <RequireAll>
        Require valid-user
        Require expr "%{HTTP_HOST} =~ m#^packages\.aegisadmin\.fr(?::[0-9]+)?$#"
    </RequireAll>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>
