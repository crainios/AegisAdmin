<!doctype html><html lang="{{LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MySQL — AegisAdmin</title><link rel="stylesheet" href="/assets/app.css?v={{VERSION}}"></head><body class="dashboard-body"><main class="dashboard-shell"><header class="dashboard-header"><div><p class="eyebrow">AegisAdmin</p><h1>MySQL / MariaDB</h1><p class="muted">{{T:mysql.subtitle}} {{PERMISSION}}</p></div><div class="header-actions"><a class="secondary-link" href="/go/dashboard">{{T:mysql.dashboard}}</a><form method="post" action="/logout"><input type="hidden" name="_token" value="{{CSRF}}"><button class="secondary-button" type="submit">{{T:common.logout}}</button></form></div></header>{{NOTICE}}<section class="content-card"><h2>{{T:mysql.server.title}}</h2>{{RESTART}}<dl class="detail-list">{{SERVER}}</dl></section><section class="summary-grid"{{METRICS_HOOK}}>{{METRICS}}</section><section class="table-panel"><div class="table-scroll"><table class="data-table sortable-table" data-sortable-table><thead><tr><th aria-sort="none"><button type="button" data-sort-column="0" data-sort-type="text">{{T:mysql.database}}</button></th><th aria-sort="none"><button type="button" data-sort-column="1" data-sort-type="text">{{T:mysql.type}}</button></th><th aria-sort="none"><button type="button" data-sort-column="2" data-sort-type="number">{{T:mysql.tables}}</button></th><th aria-sort="none"><button type="button" data-sort-column="3" data-sort-type="number">{{T:mysql.size}}</button></th></tr></thead><tbody>{{DATABASES}}</tbody></table></div></section></main><script src="/assets/app.js?v={{VERSION}}" defer></script></body></html>
