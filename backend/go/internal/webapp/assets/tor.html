<!doctype html><html lang="{{LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tor — AegisAdmin</title><link rel="stylesheet" href="/assets/app.css?v={{VERSION}}"></head><body class="dashboard-body"><main class="dashboard-shell"><header class="dashboard-header"><div><p class="eyebrow">AegisAdmin</p><h1>Tor</h1><p class="muted">{{T:tor.subtitle}} {{PERMISSION}}</p></div><div class="header-actions"><a class="secondary-link" href="/go/dashboard">{{T:tor.dashboard}}</a><form method="post" action="/logout"><input type="hidden" name="_token" value="{{CSRF}}"><button class="secondary-button" type="submit">{{T:common.logout}}</button></form></div></header>{{NOTICE}}
<section class="about-grid"><article class="content-card"><h2>{{T:tor.installation}}</h2><dl class="detail-list">{{INFO}}</dl></article><article class="content-card"><h2>{{T:tor.configuration}}</h2>{{CONFIG}}</article></section><article class="content-card"><h2>{{INSTANCE_TITLE}}</h2>{{ACTIONS}}<section class="summary-grid">{{STATUS}}</section></article><section class="table-panel"><div class="table-scroll"><table class="data-table"><thead><tr><th>{{T:tor.onion_service}}</th><th>{{T:tor.address}}</th><th>{{T:tor.ports}}</th></tr></thead><tbody>{{ONIONS}}</tbody></table></div></section>
</main></body></html>
