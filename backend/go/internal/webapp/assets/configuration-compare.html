<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comparaison de snapshots — AegisAdmin</title><link rel="stylesheet" href="/assets/app.css?v={{VERSION}}"></head><body class="dashboard-body"><main class="dashboard-shell">
<header class="dashboard-header"><div><p class="eyebrow">Configuration serveur</p><h1>Comparaison de snapshots</h1><p class="muted"><code>{{SOURCE}}</code> → <code>{{TARGET}}</code></p></div><div class="header-actions"><a class="secondary-link" href="/configuration">Retour aux snapshots</a></div></header>
<section class="summary-grid" aria-label="Résumé de la comparaison">{{SUMMARY}}</section>
<div class="snapshot-sections">{{SECTIONS}}</div>
<details class="content-card snapshot-raw"><summary>Afficher le JSON brut de la comparaison</summary><pre>{{RAW}}</pre></details>
</main></body></html>
