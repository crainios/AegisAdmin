<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stockage — AegisAdmin</title>
    <link rel="stylesheet" href="/assets/app.css?v={{VERSION}}">
</head>
<body class="dashboard-body">
    <main class="dashboard-shell">
        <header class="dashboard-header">
            <div>
                <p class="eyebrow">AegisAdmin</p>
                <h1>Stockage</h1>
                <p class="muted">Capacité et occupation des volumes montés · Droit {{PERMISSION}}</p>
            </div>
            <div class="header-actions">
                <a class="secondary-link" href="/go/dashboard">Tableau de bord</a>
                <form method="post" action="/logout">
                    <input type="hidden" name="_token" value="{{CSRF}}">
                    <button class="secondary-button" type="submit">Se déconnecter</button>
                </form>
            </div>
        </header>
        <section class="summary-grid" aria-label="Synthèse du stockage">{{SUMMARY}}</section>
        <section class="table-panel">
            <div class="table-scroll">
                <table class="data-table sortable-table" data-sortable-table data-sort-default-column="0" data-sort-default-direction="ascending">
                    <thead><tr><th aria-sort="none"><button type="button" data-sort-column="0" data-sort-type="text">Disque physique</button></th><th aria-sort="none"><button type="button" data-sort-column="1" data-sort-type="text">Point de montage</button></th><th aria-sort="none"><button type="button" data-sort-column="2" data-sort-type="text">Type</button></th><th aria-sort="none"><button type="button" data-sort-column="3" data-sort-type="number">Capacité</button></th><th aria-sort="none"><button type="button" data-sort-column="4" data-sort-type="number">Utilisé</button></th><th aria-sort="none"><button type="button" data-sort-column="5" data-sort-type="number">Disponible</button></th><th aria-sort="none"><button type="button" data-sort-column="6" data-sort-type="number">Occupation</button></th><th aria-sort="none"><button type="button" data-sort-column="7" data-sort-type="text">État</button></th><th aria-sort="none"><button type="button" data-sort-column="8" data-sort-type="text">Source</button></th></tr></thead>
                    <tbody>{{MOUNTS}}</tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="/assets/app.js?v={{VERSION}}" defer></script>
</body>
</html>
