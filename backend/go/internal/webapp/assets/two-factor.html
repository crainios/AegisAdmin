<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Double authentification — AegisAdmin</title><link rel="preload" href="/assets/auth-background.webp?v={{VERSION}}" as="image" type="image/webp"><link rel="stylesheet" href="/assets/app.css?v={{VERSION}}"></head><body class="auth-body"><div class="auth-shell"><main class="auth-shell__content"><header class="auth-brand"><strong class="app-brand__name">AegisAdmin</strong><small class="app-brand__version">v {{VERSION}}</small></header><section class="auth-card" aria-label="Double authentification"><header class="auth-page-header"><h1>Double authentification</h1><p>Saisissez le code à six chiffres affiché par votre application d’authentification.</p></header>{{ERROR}}<form class="auth-form" method="post" action="/go/two-factor"><input type="hidden" name="_token" value="{{CSRF}}"><label class="auth-field" for="code"><span>Code de vérification</span><input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9 ]{6,11}" maxlength="11" autocomplete="one-time-code" required autofocus></label><div class="auth-form__actions"><button class="primary-button">Vérifier</button></div></form></section></main></div></body></html>
