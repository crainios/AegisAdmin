<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configuration serveur — AegisAdmin</title>
<link rel="stylesheet" href="/assets/app.css?v={{VERSION}}">
</head>
<body class="dashboard-body">
<main class="dashboard-shell">
<header class="dashboard-header">
<div>
<p class="eyebrow">AegisAdmin</p>
<h1>Configuration serveur</h1>
<p class="muted">Inventaire en lecture seule et snapshots immuables</p>
</div>
<div class="header-actions">
<a class="secondary-link" href="/go/dashboard">Tableau de bord</a>
<form method="post" action="/logout">
<input type="hidden" name="_token" value="{{CSRF}}">
<button class="secondary-button">Se déconnecter</button>
</form>
</div>
</header>{{NOTICE}}<section class="summary-grid">{{SUMMARY}}</section>
<section class="content-card">
<h2>Créer un snapshot</h2>
<form class="selector-form" method="post" action="/configuration/snapshots">
<input type="hidden" name="_token" value="{{CSRF}}">
<input name="name" maxlength="100" required>
<button class="primary-button">Capturer l’état actuel</button>
</form>
</section>
<div class="configuration-tools">
<section class="content-card">
<h2>Importer un snapshot</h2>
<form class="selector-form" method="post" action="/configuration/snapshots/import" enctype="multipart/form-data"><input type="hidden" name="_token" value="{{CSRF}}"><label>Nom</label><input name="name" maxlength="100" required><label>Snapshot JSON</label><input type="file" name="snapshot" accept="application/json,.json" required><button class="primary-button">Importer</button></form>
</section>
<section class="content-card">
<h2>Comparer des snapshots</h2>
<form class="selector-form configuration-compare-form" method="get" action="/configuration/compare"><label for="snapshot-source">Snapshot source</label><select id="snapshot-source" name="source" required>{{SNAPSHOT_SOURCE_OPTIONS}}</select><label for="snapshot-target">Snapshot cible</label><select id="snapshot-target" name="target" required>{{SNAPSHOT_TARGET_OPTIONS}}</select><button class="secondary-button"{{COMPARE_DISABLED}}>Comparer</button></form>
</section>
</div>
<section class="table-panel configuration-snapshot-list">
<h2>Liste des Snapshots</h2>{{SNAPSHOTS}}</section>
<section class="table-panel configuration-current-inventory">
<h2>Inventaire actuel</h2>{{INVENTORY}}</section>
</main>
</body>
</html>
