<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journaux — AegisAdmin</title><link rel="stylesheet" href="/assets/app.css?v={{VERSION}}"></head>
<body class="dashboard-body"><main class="dashboard-shell">
<header class="dashboard-header"><div><p class="eyebrow">AegisAdmin</p><h1>Journaux</h1><p class="muted">Derniers événements enregistrés par le système · Droit {{PERMISSION}}</p></div><div class="header-actions"><a class="secondary-link" href="/go/dashboard">Tableau de bord</a><form method="post" action="/logout"><input type="hidden" name="_token" value="{{CSRF}}"><button class="secondary-button" type="submit">Se déconnecter</button></form></div></header>
<section class="detail-panel"><h2>Sélection et recherche</h2><form class="log-filters" method="get" action="/logs"><label for="source"><span>Journal</span><select id="source" name="source">{{SOURCES}}</select></label><label for="level"><span>Type d’événement</span><select id="level" name="level">{{LEVELS}}</select></label><label for="keyword"><span>Mot-clé</span><input id="keyword" name="keyword" value="{{KEYWORD}}" maxlength="128" placeholder="Texte à rechercher"></label><div class="log-filters__actions"><button class="primary-button" type="submit">Rechercher</button><a class="secondary-link" href="{{RESET_URL}}">RAZ</a></div></form></section>
<section class="terminal-panel"><div class="terminal-panel__header"><strong>{{SELECTED}}</strong><span>{{RESULTS}}</span></div><pre>{{LINES}}</pre></section>
</main></body></html>
