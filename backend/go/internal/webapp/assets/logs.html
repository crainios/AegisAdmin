<!doctype html><html lang="{{LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{T:logs.title}} — AegisAdmin</title><link rel="stylesheet" href="/assets/app.css?v={{VERSION}}"></head>
<body class="dashboard-body"><main class="dashboard-shell">
<header class="dashboard-header"><div><p class="eyebrow">AegisAdmin</p><h1>{{T:logs.title}}</h1><p class="muted">{{T:logs.subtitle}} {{PERMISSION}}</p></div><div class="header-actions"><a class="secondary-link" href="/go/dashboard">{{T:logs.dashboard}}</a><form method="post" action="/logout"><input type="hidden" name="_token" value="{{CSRF}}"><button class="secondary-button" type="submit">{{T:common.logout}}</button></form></div></header>
<section class="detail-panel"><h2>{{T:logs.search.title}}</h2><form class="log-filters" method="get" action="/logs"><label for="source"><span>{{T:logs.source}}</span><select id="source" name="source">{{SOURCES}}</select></label><label for="level"><span>{{T:logs.level}}</span><select id="level" name="level">{{LEVELS}}</select></label><label for="keyword"><span>{{T:logs.keyword}}</span><input id="keyword" name="keyword" value="{{KEYWORD}}" maxlength="128" placeholder="{{T:logs.keyword.placeholder}}"></label><div class="log-filters__actions"><button class="primary-button" type="submit">{{T:logs.search}}</button><a class="secondary-link" href="{{RESET_URL}}">{{T:logs.reset}}</a></div></form></section>
<section class="terminal-panel"><div class="terminal-panel__header"><strong>{{SELECTED}}</strong><span>{{RESULTS}}</span></div><pre>{{LINES}}</pre></section>
</main></body></html>
