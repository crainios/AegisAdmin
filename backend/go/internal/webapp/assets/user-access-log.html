<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal des accès — AegisAdmin</title><link rel="stylesheet" href="/assets/app.css?v={{VERSION}}"></head>
<body class="dashboard-body"><main class="dashboard-shell">
<header class="dashboard-header"><div><p class="eyebrow">Utilisateurs</p><h1>Journal des accès</h1><p class="muted">Authentifications et changements de sécurité</p></div><div class="header-actions"><a class="secondary-link" href="/users">Retour aux utilisateurs</a><form method="post" action="/logout"><input type="hidden" name="_token" value="{{CSRF}}"><button class="secondary-button">Se déconnecter</button></form></div></header>
<section class="content-card"><form class="access-log-filters" method="get" action="/users/access-log"><label>Utilisateur<select name="login">{{USERS}}</select></label><label>Adresse IP<input name="ip" value="{{IP}}"></label><label>Événement<select name="event">{{EVENTS}}</select></label><div class="form-actions"><button class="primary-button">Filtrer</button><a class="secondary-link" href="/users/access-log">Réinitialiser</a></div></form></section>
<section class="table-panel"><header class="section-heading"><h2>{{TOTAL}} événement(s)</h2></header><div class="table-scroll"><table class="data-table"><thead><tr><th>Date UTC</th><th>Utilisateur</th><th>Événement</th><th>Résultat</th><th>Adresse IP</th><th>Navigateur</th></tr></thead><tbody>{{ENTRIES}}</tbody></table></div></section><nav class="pagination" aria-label="Pagination">{{PAGINATION}}</nav>
</main></body></html>
