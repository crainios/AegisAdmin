<!doctype html><html lang="{{LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{T:login.title}} — AegisAdmin</title><link rel="preload" href="/assets/auth-background.webp?v={{VERSION}}" as="image" type="image/webp"><link rel="stylesheet" href="/assets/app.css?v={{VERSION}}"></head><body class="auth-body"><div class="auth-shell"><main class="auth-shell__content"><header class="auth-brand"><strong class="app-brand__name">AegisAdmin</strong><small class="app-brand__version">v {{VERSION}}</small></header><section class="auth-card" aria-label="{{T:login.title}}"><header class="auth-page-header"><h1>{{T:login.title}}</h1><p>{{T:login.subtitle}}</p></header>{{ERROR}}<form class="auth-form" method="post" action="/login"><input type="hidden" name="_token" value="{{CSRF}}"><label class="auth-field" for="login"><span>{{T:login.username}}</span><input id="login" name="login" type="text" minlength="3" maxlength="64" autocomplete="username" required autofocus></label><label class="auth-field" for="password"><span>{{T:login.password}}</span><input id="password" name="password" type="password" maxlength="1024" autocomplete="current-password" required></label><div class="auth-form__actions"><button class="primary-button">{{T:login.submit}}</button></div></form></section></main></div></body></html>
