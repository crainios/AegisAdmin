<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nouvel utilisateur — AegisAdmin</title><link rel="stylesheet" href="/assets/app.css?v={{VERSION}}"></head><body class="dashboard-body"><main class="dashboard-shell"><header class="dashboard-header"><div><p class="eyebrow">Utilisateurs</p><h1>Nouvel utilisateur</h1><p class="muted">Créer un compte et définir ses droits initiaux</p></div><div class="header-actions"><a class="secondary-link" href="/users">Retour à la liste</a><form method="post" action="/logout"><input type="hidden" name="_token" value="{{CSRF}}"><button class="secondary-button">Se déconnecter</button></form></div></header>{{ERROR}}<section class="content-card"><form class="user-form" method="post" action="/users/create"><input type="hidden" name="_token" value="{{CSRF}}"><div class="form-grid"><label>Identifiant<input name="login" value="{{LOGIN}}" minlength="3" maxlength="64" required></label><label>Prénom<input name="first_name" value="{{FIRST_NAME}}" maxlength="100" required></label><label>Nom<input name="last_name" value="{{LAST_NAME}}" maxlength="100" required></label><label>E-mail<input type="email" name="email" value="{{EMAIL}}" required></label><label>Mot de passe initial<input type="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label class="check-field"><input type="checkbox" name="two_factor_required" value="1"{{TWO_FACTOR_REQUIRED}}> 2FA obligatoire</label></div><fieldset><legend>Droits par module</legend><div class="permissions-grid">{{CREATE_PERMISSIONS}}</div></fieldset><div class="form-actions"><a class="secondary-link" href="/users">Annuler</a><button class="primary-button">Créer l’utilisateur</button></div></form></section></main></body></html>
