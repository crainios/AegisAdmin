<!doctype html>
<html lang="{{LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{T:network.title}} — AegisAdmin</title><link rel="stylesheet" href="/assets/app.css?v={{VERSION}}"></head>
<body class="dashboard-body"><main class="dashboard-shell">
<header class="dashboard-header"><div><p class="eyebrow">AegisAdmin</p><h1>{{T:network.title}}</h1><p class="muted">{{T:network.subtitle}} {{PERMISSION}}</p></div>
<div class="header-actions"><a class="secondary-link" href="/go/dashboard">{{T:network.dashboard}}</a><form method="post" action="/logout"><input type="hidden" name="_token" value="{{CSRF}}"><button class="secondary-button" type="submit">{{T:common.logout}}</button></form></div></header>
<section class="summary-grid" aria-label="{{T:network.summary}}">{{SUMMARY}}</section>
<section class="table-panel"><div class="table-scroll"><table class="data-table"><thead><tr><th>{{T:network.selection}}</th><th>{{T:network.interface}}</th><th>{{T:network.type}}</th><th>{{T:network.status}}</th></tr></thead><tbody>{{INTERFACES}}</tbody></table></div></section>
{{DETAILS}}
</main></body></html>
