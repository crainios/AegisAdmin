<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon compte — AegisAdmin</title><link rel="stylesheet" href="/assets/app.css?v={{VERSION}}"></head><body class="dashboard-body"><main class="dashboard-shell"><header class="dashboard-header"><div><p class="eyebrow">Mon compte</p><h1>Mon compte</h1><p class="muted">Mot de passe et double authentification</p></div><div class="header-actions"><a class="secondary-link" href="/go/dashboard">Retour au tableau de bord</a><form method="post" action="/logout"><input type="hidden" name="_token" value="{{CSRF}}"><button class="secondary-button">Se déconnecter</button></form></div></header>{{ERROR}}<div class="account-stack"><section class="content-card account-password-card"><h2>Changer mon mot de passe</h2><form method="post" action="/go/account/password"><input type="hidden" name="_token" value="{{CSRF}}"><label for="current-password">Mot de passe actuel</label><input id="current-password" name="current_password" type="password" maxlength="1024" autocomplete="current-password" required><label for="new-password">Nouveau mot de passe</label><input id="new-password" name="new_password" type="password" minlength="12" maxlength="512" autocomplete="new-password" required><label for="new-password-confirmation">Confirmation du nouveau mot de passe</label><input id="new-password-confirmation" name="new_password_confirmation" type="password" minlength="12" maxlength="512" autocomplete="new-password" required><div class="form-actions"><button class="primary-button">Enregistrer le nouveau mot de passe</button></div></form></section>{{TWO_FACTOR}}</div></main></body></html>
