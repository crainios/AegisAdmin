<!doctype html><html lang="{{LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{T:account.title}} — AegisAdmin</title><link rel="stylesheet" href="/assets/app.css?v={{VERSION}}"></head><body class="dashboard-body"><main class="dashboard-shell"><header class="dashboard-header"><div><p class="eyebrow">{{T:account.title}}</p><h1>{{T:account.title}}</h1><p class="muted">{{T:account.subtitle}}</p></div><div class="header-actions"><a class="secondary-link" href="/go/dashboard">{{T:account.back}}</a><form method="post" action="/logout"><input type="hidden" name="_token" value="{{CSRF}}"><button class="secondary-button">{{T:common.logout}}</button></form></div></header>{{ERROR}}<div class="account-stack">{{LANGUAGE}}<section class="content-card account-password-card"><h2>{{T:account.password.title}}</h2><form method="post" action="/go/account/password"><input type="hidden" name="_token" value="{{CSRF}}"><label for="current-password">{{T:account.password.current}}</label><input id="current-password" name="current_password" type="password" maxlength="1024" autocomplete="current-password" required><label for="new-password">{{T:account.password.new}}</label><input id="new-password" name="new_password" type="password" minlength="12" maxlength="512" autocomplete="new-password" required><label for="new-password-confirmation">{{T:account.password.confirm}}</label><input id="new-password-confirmation" name="new_password_confirmation" type="password" minlength="12" maxlength="512" autocomplete="new-password" required><div class="form-actions"><button class="primary-button">{{T:account.password.save}}</button></div></form></section>{{TWO_FACTOR}}</div></main></body></html>
