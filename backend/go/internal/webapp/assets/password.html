<!doctype html><html lang="{{LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{T:password.required.title}} — AegisAdmin</title><link rel="preload" href="/assets/auth-background.webp?v={{VERSION}}" as="image" type="image/webp"><link rel="stylesheet" href="/assets/app.css?v={{VERSION}}"></head><body class="auth-body"><div class="auth-shell"><main class="auth-shell__content"><header class="auth-brand"><strong class="app-brand__name">AegisAdmin</strong><small class="app-brand__version">v {{VERSION}}</small></header><section class="auth-card"><header class="auth-page-header"><h1>{{T:password.required.title}}</h1><p>{{T:password.required.help}}</p></header>{{ERROR}}<form class="auth-form" method="post" action="/go/account/password"><input type="hidden" name="_token" value="{{CSRF}}"><label class="auth-field" for="current-password"><span>{{T:account.password.current}}</span><input id="current-password" name="current_password" type="password" maxlength="1024" autocomplete="current-password" required autofocus></label><label class="auth-field" for="new-password"><span>{{T:account.password.new}}</span><input id="new-password" name="new_password" type="password" minlength="12" maxlength="512" autocomplete="new-password" required></label><label class="auth-field" for="new-password-confirmation"><span>{{T:password.confirm}}</span><input id="new-password-confirmation" name="new_password_confirmation" type="password" minlength="12" maxlength="512" autocomplete="new-password" required></label><div class="auth-form__actions"><button class="primary-button">{{T:account.password.save}}</button></div></form></section></main></div></body></html>
