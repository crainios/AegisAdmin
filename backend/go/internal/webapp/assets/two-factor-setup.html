<!doctype html><html lang="{{LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{T:two_factor.setup.title}} — AegisAdmin</title><link rel="preload" href="/assets/auth-background.webp?v={{VERSION}}" as="image" type="image/webp"><link rel="stylesheet" href="/assets/app.css?v={{VERSION}}"></head><body class="auth-body"><div class="auth-shell"><main class="auth-shell__content"><header class="auth-brand"><strong class="app-brand__name">AegisAdmin</strong><small class="app-brand__version">v {{VERSION}}</small></header><section class="auth-card two-factor-setup" aria-label="{{T:two_factor.setup.title}}"><header class="auth-page-header"><h1>{{T:two_factor.setup.title}}</h1><p>{{T:two_factor.setup.help}}</p></header>{{ERROR}}<div class="qr-code"><img src="data:image/png;base64,{{QRCODE}}" alt="{{T:two_factor.setup.qr_alt}}" width="256" height="256"></div><p class="manual-key">{{T:two_factor.setup.manual_key}} : <code>{{SECRET}}</code></p><form class="auth-form" method="post" action="{{ACTION}}"><input type="hidden" name="_token" value="{{CSRF}}"><label class="auth-field" for="code"><span>{{T:two_factor.setup.control_code}}</span><input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9 ]{6,11}" maxlength="11" autocomplete="one-time-code" required autofocus></label><div class="auth-form__actions"><button class="primary-button">{{T:two_factor.setup.confirm}}</button></div></form></section></main></div></body></html>
