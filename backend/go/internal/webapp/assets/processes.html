<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Processus — AegisAdmin</title><link rel="stylesheet" href="/assets/app.css?v={{VERSION}}"></head>
<body class="dashboard-body"><main class="dashboard-shell"><header class="dashboard-header"><div><p class="eyebrow">Supervision</p><h1>Processus</h1><p class="muted">Vue détaillée en lecture seule des processus actuellement détectés sur le serveur</p></div><div class="header-actions"><a class="primary-button" href="/processes">Actualiser</a><a class="secondary-link" href="/go/dashboard">Tableau de bord</a><form method="post" action="/logout"><input type="hidden" name="_token" value="{{CSRF}}"><button class="secondary-button" type="submit">Se déconnecter</button></form></div></header>{{NOTICE}}
<section class="summary-grid"><article class="summary-item"><span>Processus détectés</span><strong>{{TOTAL}}</strong></article><article class="summary-item"><span>Processus affichés</span><strong>{{RETURNED}}</strong></article><article class="summary-item"><span>Limite d’affichage</span><strong>{{LIMIT}}</strong></article></section>
<section class="table-panel"><div class="table-scroll"><table class="data-table sortable-table" data-sortable-table><thead><tr><th aria-sort="none"><button type="button" data-sort-column="0" data-sort-type="number" title="Identifiant unique du processus">PID</button></th><th aria-sort="none"><button type="button" data-sort-column="1" data-sort-type="text">Processus</button></th><th aria-sort="none"><button type="button" data-sort-column="2" data-sort-type="text">Utilisateur</button></th><th aria-sort="none"><button type="button" data-sort-column="3" data-sort-type="text">État</button></th><th aria-sort="none"><button type="button" data-sort-column="4" data-sort-type="number" title="Part de temps processeur utilisée par le processus">CPU</button></th><th aria-sort="none"><button type="button" data-sort-column="5" data-sort-type="number">Mémoire</button></th><th aria-sort="none"><button type="button" data-sort-column="6" data-sort-type="number" title="Mémoire physique actuellement occupée par le processus">RSS</button></th><th aria-sort="none"><button type="button" data-sort-column="7" data-sort-type="number">Durée</button></th></tr></thead><tbody>{{PROCESSES}}</tbody></table></div></section></main></body></html>
