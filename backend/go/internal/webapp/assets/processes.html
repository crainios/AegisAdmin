<!doctype html>
<html lang="{{LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{T:processes.title}} — AegisAdmin</title><link rel="stylesheet" href="/assets/app.css?v={{VERSION}}"></head>
<body class="dashboard-body"><main class="dashboard-shell"><header class="dashboard-header"><div><p class="eyebrow">{{T:processes.eyebrow}}</p><h1>{{T:processes.title}}</h1><p class="muted">{{T:processes.subtitle}}</p></div><div class="header-actions"><a class="primary-button" href="/processes">{{T:processes.refresh}}</a><a class="secondary-link" href="/go/dashboard">{{T:processes.dashboard}}</a><form method="post" action="/logout"><input type="hidden" name="_token" value="{{CSRF}}"><button class="secondary-button" type="submit">{{T:common.logout}}</button></form></div></header>{{NOTICE}}
<section class="summary-grid"><article class="summary-item"><span>{{T:processes.detected}}</span><strong>{{TOTAL}}</strong></article><article class="summary-item"><span>{{T:processes.displayed}}</span><strong>{{RETURNED}}</strong></article><article class="summary-item"><span>{{T:processes.limit}}</span><strong>{{LIMIT}}</strong></article></section>
<section class="table-panel"><div class="table-scroll"><table class="data-table sortable-table" data-sortable-table><thead><tr><th aria-sort="none"><button type="button" data-sort-column="0" data-sort-type="number" title="{{T:processes.pid_help}}">PID</button></th><th aria-sort="none"><button type="button" data-sort-column="1" data-sort-type="text">{{T:processes.process}}</button></th><th aria-sort="none"><button type="button" data-sort-column="2" data-sort-type="text">{{T:processes.user}}</button></th><th aria-sort="none"><button type="button" data-sort-column="3" data-sort-type="text">{{T:processes.state}}</button></th><th aria-sort="none"><button type="button" data-sort-column="4" data-sort-type="number" title="{{T:processes.cpu_help}}">CPU</button></th><th aria-sort="none"><button type="button" data-sort-column="5" data-sort-type="number">{{T:processes.memory}}</button></th><th aria-sort="none"><button type="button" data-sort-column="6" data-sort-type="number" title="{{T:processes.rss_help}}">RSS</button></th><th aria-sort="none"><button type="button" data-sort-column="7" data-sort-type="number">{{T:processes.elapsed}}</button></th></tr></thead><tbody>{{PROCESSES}}</tbody></table></div></section></main></body></html>
